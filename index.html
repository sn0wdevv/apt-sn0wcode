<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>sn0wcode Repo</title>

<link
rel="icon"
type="image/png"
href="favicon.png"
>

<link
rel="stylesheet"
href="style.css"
>

<style>

body {

    margin:0;
    padding:0;

    background:
        #c8ced6
        url("https://cydia.saurik.com/cytyle/pinstripes.png");

    font-family:Helvetica;

    font-size:13px;

    color:#000;

}

panel {

    display:block;

    width:300px;

    margin:
        20px auto;

}

fieldset {

    border:none;

    margin:0 0 14px 0;

    padding:0;

    background:#ffffff;

    border:
        1px solid #999;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9);

}

fieldset a {

    text-decoration:none;

    color:#000;

}

.header {

    background:#2d4f7c;

    color:white;

    text-align:center;

    font-weight:bold;

    font-size:15px;

    padding:10px;

    text-shadow:
        0 1px 1px rgba(0,0,0,0.45),
        0 1px 0 rgba(255,255,255,0.15);

    -webkit-user-select:none;

}

.icon {

    width:24px;

    height:24px;

    vertical-align:middle;

    margin-right:6px;

    border-radius:5px;

}

.item {

    position:relative;

    padding:
        12px 12px;

    border-top:
        1px solid #d6d6d6;

    background:white;

    -webkit-user-select:none;

    text-shadow:
        0 1px 0 rgba(255,255,255,0.85);

    font-weight:bold;

}

.arrow {

    background-image:
        url("arrow.png");

    background-repeat:no-repeat;

    background-position:
        right 12px center;

    background-size:
        10px 14px;

}

label {

    display:block;

    color:#4c566c;

    font-weight:bold;

    font-size:18px;

    margin:
        8px 0 4px 6px;

    text-shadow:
        0 1px 0 rgba(255,255,255,0.9);

    -webkit-user-select:none;

}

.infoText {

    padding:12px;

    line-height:18px;

    font-size:13px;

    color:#000;

    text-shadow:
        0 1px 0 rgba(255,255,255,0.85);

    -webkit-user-select:none;

    cursor:default;

}

.infoText div {

    margin-bottom:4px;

}

.footer {

    text-align:center;

    font-size:11px;

    color:#666;

    margin-top:10px;

    text-shadow:
        0 1px 0 rgba(255,255,255,0.9);

    -webkit-user-select:none;

}

</style>

</head>

<body>

<panel>

<fieldset>

<div class="header">

<img
src="CydiaIcon.png"
class="icon"
>

sn0wcode Repo

</div>

<a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://apt.sn0wcode.com">

<div class="item arrow">

Add to Cydia

</div>

</a>

</fieldset>

<label>

Important Info

</label>

<fieldset>

<div class="infoText">

<div>
Welcome to the sn0wcode repo backup.
</div>

<div>
Commercial package support for iOS 6 is currently in development.
</div>

</div>

</fieldset>

<fieldset>

<a
href="https://sn0wcode.com"
target="_blank"
>

<div class="item arrow">

My Website

</div>

</a>

</fieldset>

<div class="footer">

Compatible with iOS 6.1.x

<br>

by sn0wcode

</div>

</panel>

</body>

</html>
